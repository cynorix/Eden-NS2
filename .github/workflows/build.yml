name: Windows Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows MSYS2 build
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git
            base-devel
            autotools
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DBUILD_TESTING=OFF \
                    -DYUZU_TESTS=OFF \
                    -DENABLE_WERROR=OFF \
                    -DYUZU_ROOM=OFF \
                    -DYUZU_CMD=OFF \
                    -DENABLE_LIBUSB=OFF \
                    -Denet_FORCE_BUNDLED=ON \
                    -Dlibusb_FORCE_BUNDLED=ON \
                    -DVulkanMemoryAllocator_FORCE_BUNDLED=ON \
                    -DVulkanHeaders_FORCE_BUNDLED=ON \
                    -DVulkanUtilityLibraries_FORCE_BUNDLED=ON

      - name: Build
        run: ninja -C build yuzu

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eden-ns2-windows
          path: build/bin/eden.exe
